<!DOCTYPE html>

<html>
   <head>
      <meta charset="utf-8">
      <title>8.10</title>
      <script>

         for ( var dia = 1; dia <= 12; ++dia )
         {
            document.writeln( "<p><strong>En el día " + dia + " de Navidad, mi verdadero amor me dio:</strong><br>" );

            switch ( dia )
            {
               case 12:
                  document.writeln( "Doce tamborileros tocando,<br>" );
               case 11:
                  document.writeln( "Once gaiters tocando,<br>" );
               case 10:
                  document.writeln( "Diez señores saltando,<br>" );
               case 9:
                  document.writeln( "Nueve damas bailando,<br>" );
               case 8:
                  document.writeln( "Ocho lecheras ordeñando,<br>" );
               case 7:
                  document.writeln( "Siete cisnes nadando,<br>" );
               case 6:
                  document.writeln( "Seis gansos poniendo,<br>" );
               case 5:
                  document.writeln( "¡Cinco anillos de oro!<br>" );
               case 4:
                  document.writeln( "Cuatro pájaros llamativos,<br>" );
               case 3:
                  document.writeln( "Tres gallinas francesas,<br>" );
               case 2:
                  document.writeln( "Dos tórtolas y<br>" );
               case 1:
                  document.writeln( (dia === 1 ? "" : "Un ") + "Perdiz en un peral." );
                  break;
            }

            document.writeln( "</p>" );
         }

      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
