<!DOCTYPE html>

<html>
   <head>
      <meta charset="utf-8">
      <title>8.11</title>
      <script>

         var totalGeneral = 0;
         var continuar = true;

         while ( continuar )
         {
            var entradaProducto = window.prompt( "Ingrese el número de producto (1 a 5) o pulse Cancelar para terminar:", "1" );

            if ( entradaProducto === null )
            {
               break;
            }

            var productoID = parseInt( entradaProducto );
            var cantidad = parseInt( window.prompt( "Ingrese la cantidad vendida:", "1" ) );
            var precio = 0;

            switch ( productoID )
            {
               case 1:
                  precio = 2.98;
                  break;
               case 2:
                  precio = 4.50;
                  break;
               case 3:
                  precio = 9.98;
                  break;
               case 4:
                  precio = 4.49;
                  break;
               case 5:
                  precio = 6.87;
                  break;
               default:
                  document.writeln( "<p>Número de producto inválido: " + productoID + "</p>" );
                  continue;
            }

            var totalProducto = precio * cantidad;
            totalGeneral += totalProducto;
            document.writeln( "<p>Producto " + productoID + " - Cantidad: " + cantidad + " - Subtotal: $" + totalProducto.toFixed(2) + "</p>" );
         }

         document.writeln( "<h3>Valor total de venta de la semana pasada: $" + totalGeneral.toFixed(2) + "</h3>" );

      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
