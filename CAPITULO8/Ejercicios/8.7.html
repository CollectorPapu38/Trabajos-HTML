<!DOCTYPE html>

<html>
   <head>
      <meta charset="utf-8">
      <title>8.7</title>
      <script>

         var producto = 1;

         for ( var i = 1; i <= 15; i += 2 )
         {
            producto *= i;
         }

         document.writeln( "<h3>El producto de los enteros impares del 1 al 15 es: " + producto + "</h3>" );

      </script>
   </head>
