<!DOCTYPE html>


<html>
   <head>
      <meta charset="utf-8">
      <title>8.5</title>
      <script>

         document.writeln( "<table>" );

         for ( var i = 1; i <= 10; ++i )
         {
            document.writeln( "<tr>" );

            for ( var j = 1; j <= 5; ++j )
               document.writeln( "<td>(" + i + ", " + j + ")</td>" );

            document.writeln( "</tr>" );
         } // fin de for

         document.writeln( "</table>" );

      </script>
   </head>
   <body>
    <h3>Lo que haces es que Se imprime una tabla con las </h3>
     <h3>     coordenadas de cada celda, desde (1, 1) en la  </h3>
      <h3>   esquina superior izquierda hasta (10, 5) en la  </h3>
      <h3>    esquina inferior derecha.<h3>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
