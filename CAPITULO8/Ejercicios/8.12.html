<!DOCTYPE html>

<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.12</title>
      <style>
         body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
         h2 { color: #003366; border-bottom: 2px solid #003366; padding-bottom: 5px; }
         ul { margin-bottom: 20px; }
      </style>
      <script>

         var i = 1, j = 2, k = 3, m = 2;

         document.writeln( "<h2>Resultados del Ejercicio 8.12</h2>" );
         document.writeln( "<ul>" );
         document.writeln( "<li><strong>a)</strong> i - 1 = " + (i - 1) + "</li>" );
         document.writeln( "<li><strong>b)</strong> j - 3 = " + (j - 3) + "</li>" );
         document.writeln( "<li><strong>c)</strong> i &lt; 1 && j &lt; 4 = " + (i < 1 && j < 4) + "</li>" );
         document.writeln( "<li><strong>d)</strong> m &lt; 99 && k &lt; m = " + (m < 99 && k < m) + "</li>" );
         document.writeln( "<li><strong>e)</strong> j &gt;= 1 || k == m = " + (j >= 1 || k == m) + "</li>" );
         document.writeln( "<li><strong>f)</strong> k + m &lt; j || 3 * j &gt;= k = " + (k + m < j || 3 * j >= k) + "</li>" );
         document.writeln( "<li><strong>g)</strong> !( k &gt; m ) = " + (!(k > m)) + "</li>" );
         document.writeln( "</ul>" );

      </script>
   </head>

         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
