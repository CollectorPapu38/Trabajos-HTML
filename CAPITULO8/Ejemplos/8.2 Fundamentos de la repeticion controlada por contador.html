<!DOCTYPE html>

<!-- Fig. 8.1: ContadorWhile.html -->
<!-- Repetición controlada por un contador. -->
<html>
   <head>
      <meta charset= "utf-8">
      <title>Repetici&oacute;n controlada por contador</title>
      <script>

         var contador = 1; // inicialización

         while ( contador <= 7) // condición de repetición
         {
            document.writeln( "<p style = 'font-size: " +
               contador + "ex'>Tama&ntilde;o de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
         } //fin de while

      </script>
   </head><body>

   <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>

   </body>
</html>
