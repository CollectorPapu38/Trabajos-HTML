<!DOCTYPE html>

<html>

   <head>

      <meta charset="utf-8">

      <title>Ejercicio 7.15 </title>

      <script>

         // Declarar e inicializar las variables antes del while

         var contador = 1;

         var numeroTexto;

         var numero;

         var mayor = 0;



         document.writeln( "<h1>Resultado del Número Mayor</h1>" );



         while ( contador <= 10 )

         {

            numeroTexto = window.prompt( "Escriba un número de un solo dígito (" + contador + " de 10):", "0" );

            numero = parseInt( numeroTexto );



            if ( numero > mayor )

            {

               mayor = numero;

            }



            contador = contador + 1;

         }



         document.writeln( "<p>El número más grande introducido es: " + mayor + "</p>" );

      </script>

   </head>

   <body>

      <br>

      <a href="Indi.html">

         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">

      </a>

   </body>

</html>
