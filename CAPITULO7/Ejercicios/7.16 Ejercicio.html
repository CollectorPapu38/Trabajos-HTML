<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.16</title>
      <style>
         table {
            border-collapse: collapse;
            width: 300px;
         }
         th, td {
            border: 1px solid black;
            text-align: center;
            padding: 5px;
         }
      </style>
      <script>
         var n = 1;

         document.writeln( "<table>" );
         document.writeln( "<tr><th>N</th><th>10*N</th><th>100*N</th><th>1000*N</th></tr>" );

         while ( n <= 6 )
         {
            document.writeln( "<tr>" );
            document.writeln( "<td>" + n + "</td>" );
            document.writeln( "<td>" + ( n * 10 ) + "</td>" );
            document.writeln( "<td>" + ( n * 100 ) + "</td>" );
            document.writeln( "<td>" + ( n * 1000 ) + "</td>" );
            document.writeln( "</tr>" );

            n = n + 1;
         }

         document.writeln( "</table>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
