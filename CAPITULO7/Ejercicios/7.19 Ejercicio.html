<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.19</title>
      <script>
         var x = 9;
         var y = 11;

         document.writeln( "<h3>Prueba con x = 9 y y = 11 (Inciso a)</h3>" );
         if ( x < 10 )
            if ( y > 10 )
               document.writeln( "<p>*****</p>" );
            else
               document.writeln( "<p>#####</p>" );
         document.writeln( "<p>$$$$$</p>" );

         document.writeln( "<h3>Prueba con x = 11 y y = 9 (Inciso a)</h3>" );
         x = 11;
         y = 9;
         if ( x < 10 )
            if ( y > 10 )
               document.writeln( "<p>*****</p>" );
            else
               document.writeln( "<p>#####</p>" );
         document.writeln( "<p>$$$$$</p>" );
      </script>
   </head>
