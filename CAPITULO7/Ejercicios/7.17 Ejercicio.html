<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 17<title>
      <script>
         var contador = 1;
         var numeroTexto;
         var numero;
         var mayor1 = 0;
         var mayor2 = 0;

         document.writeln( "<h1>Los dos números más grandes</h1>" );

         while ( contador <= 10 )
         {
            numeroTexto = window.prompt( "Escriba un número (" + contador + " de 10):", "0" );
            numero = parseInt( numeroTexto );

            if ( numero > mayor1 )
            {
               mayor2 = mayor1;
               mayor1 = numero;
            }
            else if ( numero > mayor2 )
            {
               mayor2 = numero;
            }

            contador = contador + 1;
         }

         document.writeln( "<p>El número más grande es: " + mayor1 + "</p>" );
         document.writeln( "<p>El segundo número más grande es: " + mayor2 + "</p>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
