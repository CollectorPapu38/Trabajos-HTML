<!DOCTYPE html>
<!-- Ejercicio 11.12 -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 11.12</title>
    <script>
        function convertir()
        {
            var texto = document.getElementById( "campoTexto" ).value;
            document.getElementById( "mayusculas" ).innerHTML = "<strong>May&uacute;sculas:</strong> " + texto.toUpperCase();
            document.getElementById( "minusculas" ).innerHTML = "<strong>Min&uacute;sculas:</strong> " + texto.toLowerCase();
        }

        function iniciar()
        {
            document.getElementById( "botonConvertir" ).addEventListener( "click", convertir, false );
        }

        window.addEventListener( "load", iniciar, false );
    </script>
</head>
<body>
    <h1>Ejercicio 11.12</h1>
    <h2>Texto en mayúsculas y minúsculas</h2>

    <form action = "#">
        <p><label>Texto: <input id = "campoTexto" type = "text" size = "50"></label>
           <input id = "botonConvertir" type = "button" value = "Convertir"></p>
    </form>
    <p id = "mayusculas"></p>
    <p id = "minusculas"></p>

    <p>
         </a>
            <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
    </p>
</body>
</html>
