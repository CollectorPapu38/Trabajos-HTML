<!DOCTYPE html>
<!-- Ejercicio 11.04 -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 11.04</title>
    <style>
        table    { border-collapse: collapse; margin: 0.5em 0; }
        th, td   { border: 1px solid black; padding: 0.2em 0.6em; }
        thead th { background-color: black; color: white; }
    </style>
    <script>
        function redondear( numero, k )
        {
            return Math.floor( numero * k + .5 ) / k;
        }

        function redondearAEntero( numero )     { return redondear( numero, 1 ); }
        function redondearADecimas( numero )    { return redondear( numero, 10 ); }
        function redondearACentesimas( numero ) { return redondear( numero, 100 ); }
        function redondearAMilesimas( numero )  { return redondear( numero, 1000 ); }

        function agregarFila()
        {
            var x = parseFloat( document.getElementById( "campoNumero" ).value );
            if ( isNaN( x ) )
                return;

            document.getElementById( "filas" ).innerHTML +=
                "<tr><td>" + x + "</td><td>" + redondearAEntero( x ) + "</td><td>" +
                redondearADecimas( x ) + "</td><td>" + redondearACentesimas( x ) + "</td><td>" +
                redondearAMilesimas( x ) + "</td></tr>";
        }

        function iniciar()
        {
            document.getElementById( "botonRedondear" ).addEventListener( "click", agregarFila, false );
        }

        window.addEventListener( "load", iniciar, false );
    </script>
</head>
<body>
    <h1>Ejercicio 11.04</h1>
    <h2>Redondear con Math.floor</h2>

    <p>Se usan las fórmulas del libro, <code>Math.floor( x * 10 + .5 ) / 10</code> para décimas y así sucesivamente,
    con <code>k</code> = 1, 10, 100 o 1000:</p>
    <form action = "#">
        <p><label>N&uacute;mero: <input id = "campoNumero" type = "number" step = "any"></label>
           <input id = "botonRedondear" type = "button" value = "Redondear"></p>
    </form>
    <table>
        <thead><tr><th>Original</th><th>Entero</th><th>D&eacute;cimas</th><th>Cent&eacute;simas</th><th>Mil&eacute;simas</th></tr></thead>
        <tbody id = "filas"></tbody>
    </table>
    <p><strong>Prueba:</strong> 3.14159 da 3, 3.1, 3.14 y 3.142; 2.71828 da 3, 2.7, 2.72 y 2.718.</p>

    <p>
    </a>
            <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
    </p>
</body>
</html>
