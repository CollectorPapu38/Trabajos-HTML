<body>

    <h2>Formulario con Datalist</h2>

    <form method="post" action="http://www.deitel.com">
        <p>
            Día de la semana: 
            <input type="text" name="dia" list="diasSemana" placeholder="Seleccione un día" autofocus>
            <datalist id="diasSemana">
                <option value="Lunes">
                <option value="Martes">
                <option value="Miércoles">
                <option value="Jueves">
                <option value="Viernes">
                <option value="Sábado">
                <option value="Domingo">
            </datalist>
            <input type="submit" value="Enviar">
        </p>
    </form>
