<!DOCTYPE html>

<!-- Fig. 3.1: nuevostiposinputformularios.html -->
<!-- Los nuevos tipos de elementos input de formularios de HTML5 y sus atributos. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Nuevos tipos de input de HTML5</title>
</head>

<body>
    <!-- 3.1 Muestra los nuevos tipos de elementos de formularios -->
    <h1>Demo de nuevos tipos de input de HTML5</h1>
    <p>Este formulario demuestra los nuevos tipos de elementos input de HTML5
    y los atributos placeholder, required y autofocus.
    </p>

    <form method = "post" action = "http://www.deitel.com">
        <p>
            <label>Color:
                <!-- 3.2.1 Input tipo color: permite seleccionar o ingresar un color hexadecimal -->
                <!-- Atributo autofocus: da el enfoque automático al cargar la página -->
                <input type = "color" autofocus />
                (C&oacute;digo hexadecimal como #ADD8E6)
            </label>
        </p>
        <p>
            <label>Fecha:
                <!-- 3.2.2 Input tipo date: permite seleccionar o ingresar una fecha (aaaa-mm-dd) -->
                <input type = "date" />
                (aaaa-mm-dd)
            </label>
        </p>
        <p>
            <label>Hora y fecha:
                <!-- 3.2.3 Input tipo datetime: permite ingresar fecha y hora en formato UTC -->
                <input type = "datetime" />
                (aaaa-mm-ddThh:mm+ff:gg, como 27-01-2012T03:15)
            </label>
        </p>
        <p>
            <label>Hora y fecha-local:
                <!-- 3.2.4 Input tipo datetime-local: permite ingresar fecha y hora local -->
                <input type = "datetime-local" />
                (aaaa-mm-ddThh:mm, como 2012-01-27T03:15)
            </label>
        </p>
        <p>
            <label>Email:
                <!-- 3.2.5 Input tipo email: valida formato de correo electrónico -->
                <!-- Atributo placeholder: muestra texto descriptivo temporal -->
                <!-- Atributo required: obliga a llenar el campo antes de enviar -->
                <input type = "email" placeholder = "nombre@dominio.com"
                    required /> (nombre@dominio.com)
            </label>
        </p>
        <p>
            <label>Mes:
                <!-- 3.2.6 Input tipo month: permite seleccionar año y mes (aaaa-mm) -->
                <input type = "month" /> (aaaa-mm)
            </label>
        </p>
        <p>
            <label>N&uacute;mero:
                <!-- 3.2.7 Input tipo number: permite ingresar valores numéricos dentro de un rango -->
                <input type = "number"
                    min = "0"
                    max = "7"
                    step = "1"
                    value = "4" />
            </label> (Escriba un n&uacute;mero entre 0 y 7)
        </p>
        <p>
            <label>Rango:
                <!-- 3.2.8 Input tipo range: muestra un control deslizante numérico -->
                0 <input type = "range"
                    min = "0"
                    max = "20"
                    value = "10" /> 20
            </label>
        </p>
        <p>
            <label>B&uacute;squeda:
                <!-- 3.2.9 Input tipo search: campo de texto optimizado para búsquedas -->
                <input type = "search" placeholder = "consulta de b&uacute;squeda" />
            </label> (Escriba aqu&iacute; su consulta de b&uacute;squeda.)
        </p>
        <p>
            <label>Tel:
                <!-- 3.2.10 Input tipo tel: campo para teléfono validado con expresión regular (pattern) -->
                <input type = "tel" placeholder = "(###) ###-####"
                    pattern = "^\(\d{3}\) +\d{3}-\d{4}" required />
                (###) ###-####
            </label>
        </p>
        <p>
            <label>Hora:
                <!-- 3.2.11 Input tipo time: permite ingresar una hora (hh:mm) -->
                <input type = "time" /> (hh:mm)
            </label>
        </p>
        <p>
            <label>URL:
                <!-- 3.2.12 Input tipo url: valida formato de dirección web -->
                <input type = "url"
                    placeholder = "http://www.nombredominio.com" />
                (http://www.nombredominio.com)
            </label>
        </p>
        <p>
            <label>Semana:
                <!-- 3.2.13 Input tipo week: permite seleccionar año y número de semana -->
                <input type = "week" />
                (aaaa-Wnn, tal como 2012-W01)
            </label>
        </p>
        <p>
            <input type = "submit" value = "Enviar" />
            <input type = "reset" value = "Borrar" />
        </p>
    </form>
    <a href="3.1_Indice.html">
    <img src="image/rever.png" alt="Regresar al índice">
</a>
</body>
</html>
