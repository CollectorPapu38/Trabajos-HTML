<!DOCTYPE html>
<!-- Ejercicio 6.18: ej6-18.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.18</title>
      <script>
         var s1;
         var s2;
         var s3;
         var n1;
         var n2;
         var n3;
         var suma;
         var promedio;
         var producto;
         var menor;
         var mayor;

         s1 = window.prompt( "Bienvenido, Digite numero cualquiera para realizar diferentes operaciones. \n \nEscriba el primer entero:" );
         s2 = window.prompt( "Escriba el segundo entero:" );
         s3 = window.prompt( "Escriba el tercer entero:" );

         n1 = parseInt( s1 );
         n2 = parseInt( s2 );
         n3 = parseInt( s3 );

         suma = n1 + n2 + n3;
         promedio = suma / 3;
         producto = n1 * n2 * n3;

         menor = n1;
         if ( n2 < menor )
            menor = n2;
         if ( n3 < menor )
            menor = n3;

         mayor = n1;
         if ( n2 > mayor )
            mayor = n2;
         if ( n3 > mayor )
            mayor = n3;

         window.alert( "Suma: " + suma +
            "\nPromedio: " + promedio +
            "\nProducto: " + producto +
            "\nMenor: " + menor +
            "\nMayor: " + mayor );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
