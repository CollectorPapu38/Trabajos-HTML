<!DOCTYPE html>
<!-- Ejercicio 6.21: ej6-21.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.21</title>
      <script>
         var entrada;
         var numero;

         entrada = window.prompt( "Escriba un número entero para saber si es impar o par:" );
         numero = parseInt( entrada );

         if ( numero % 2 == 0 )
            document.writeln( "<h1>El número " + numero + " es PAR</h1>" );

         if ( numero % 2 != 0 )
            document.writeln( "<h1>El número " + numero + " es IMPAR</h1>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
