<!DOCTYPE html>
<!-- Ejercicio 6.19: ej6-19.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.19</title>
      <script>
         var entradaRadio;
         var r;
         var diametro;
         var circunferencia;
         var area;

         entradaRadio = window.prompt( "Escriba el radio del círculo:" );
         r = parseFloat( entradaRadio );

         diametro = 2 * r;
         circunferencia = 2 * 3.14159 * r;
         area = 3.14159 * r * r;

         document.writeln( "<h1>Resultados del Círculo</h1>" );
         document.writeln( "Diámetro = " + diametro + "<br>" );
         document.writeln( "Circunferencia = " + circunferencia + "<br>" );
         document.writeln( "Área = " + area + "<br>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
