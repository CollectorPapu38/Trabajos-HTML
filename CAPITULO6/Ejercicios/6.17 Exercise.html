<!DOCTYPE html>
<!-- Ejercicio 6.17: ej6-17.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.17</title>
      <script>
         var primerNumero;
         var segundoNumero;
         var numero1;
         var numero2;

         primerNumero = window.prompt( "Bienvenido, acontinucion siga la indicacion para realizar un mayor/menor. \n \nEscriba el primer entero:" );
         segundoNumero = window.prompt( "Escriba el segundo entero:" );

         numero1 = parseInt( primerNumero );
         numero2 = parseInt( segundoNumero );

         if ( numero1 > numero2 )
            window.alert( numero1 + " es mayor que " + numero2 );

         if ( numero2 > numero1 )
            window.alert( numero2 + " es mayor que " + numero1 );

         if ( numero1 == numero2 )
            document.writeln( "<h1>Estos números son iguales</h1>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
