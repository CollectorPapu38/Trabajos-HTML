<!DOCTYPE html>
<!-- Ejercicio 6.22: ej6-22.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 6.22</title>
      <script>
         var s1, s2;
         var n1, n2;

         s1 = window.prompt( "Escriba el primer entero:" );
         s2 = window.prompt( "Escriba el segundo entero:" );

         n1 = parseInt( s1 );
         n2 = parseInt( s2 );

         if ( n1 % n2 == 0 )
            document.writeln( "<h1>" + n1 + " es múltiplo de " + n2 + "</h1>" );

         if ( n1 % n2 != 0 )
            document.writeln( "<h1>" + n1 + " NO es múltiplo de " + n2 + "</h1>" );
      </script>
   </head>
   <body>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
