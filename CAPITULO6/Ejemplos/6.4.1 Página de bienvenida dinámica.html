<!DOCTYPE html>

<!-- Fig. 6.5: bienvenido4.html -->
<!-- Cuadro indicador utilizado en una pantalla de bienvenida -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Uso de cuadros prompt y alert</title>

      
      <script>

         // Declaración de variable: reserva espacio en memoria para el nombre
         var nombre; // cadena introducida por el usuario

         // Diálogo prompt y asignación (=): lee la entrada del usuario y la guarda en la variable
         // lee el nombre del cuadro prompt como una cadena
         nombre = window.prompt( "Escriba su nombre" );

         // Concatenación (+): une la cadena inicial, la variable nombre y la cadena final
         document.writeln( "<h1>Hola " + nombre +
            ", bienvenido a la programaci&oacute;n en JavaScript</h1>" );

      </script>
      

   </head>
   <body>

     
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>

   </body>
</html>
