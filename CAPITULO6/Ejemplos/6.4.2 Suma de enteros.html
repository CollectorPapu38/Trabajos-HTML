<!DOCTYPE html>

<!-- Fig. 6.7: suma.html -->
<!-- Secuencia de comandos de suma. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Un programa de suma</title>

      <script>

         // Declaración de variables para almacenar las entradas iniciales como texto y los enteros convertidos
         var primerNumero; 
         var segundoNumero; 
         var numero1; 
         var numero2; 
         var suma; 

         // El método prompt lee el primer número ingresado como una cadena de texto
         primerNumero = window.prompt( "Escriba el primer entero" );

         // El método prompt lee el segundo número ingresado como una cadena de texto
         segundoNumero = window.prompt( "Escriba el segundo entero" );

         // La función parseInt convierte el argumento de tipo cadena (texto) a un número entero
         numero1 = parseInt( primerNumero );
         numero2 = parseInt( segundoNumero );

         // Operador aritmético (+): realiza la suma matemática ya que ambos operandos son enteros
         suma = numero1 + numero2; 

         // Operador de concatenación (+): une la etiqueta HTML, el resultado numérico y el cierre de etiqueta
         document.writeln( "<h1>La suma es " + suma + "</h1>" );

      </script>

   </head>
   <body>

      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>

   </body>
</html>
