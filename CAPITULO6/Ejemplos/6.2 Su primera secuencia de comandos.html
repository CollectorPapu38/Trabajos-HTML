<!DOCTYPE html>

<!-- Fig. 6.1: Bienvenido.html -->
<!-- Mostrar una línea de texto. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>El primer programa en JavaScript</title>

      <!-- El elemento script e indicación de secuencia de comandos -->
      <!-- indica al navegador que el texto que sigue forma parte de una secuencia de comandos -->
      <script type="text/javascript">

         // Cadenas de caracteres / Uso del objeto document / Instrucciones
         // Usan el objeto document y llaman al método writeln
         // para escribir una línea de marcado HTML5 (un encabezado h1) en el documento
         document.writeln(
            "<h1>Bienvenido a la programaci&oacute;n en JavaScript</h1>"
         );

      </script>
      <!-- indica el final de la secuencia de comandos -->

   </head>

   <body>

      <!-- Botón para regresar al índice usando una imagen -->
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>

   </body>
   <body></body>
</html>
