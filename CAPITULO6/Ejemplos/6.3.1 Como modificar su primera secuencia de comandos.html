<!-- Imprimir una línea con varias instrucciones. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Imprimir una l&iacute;nea con varias instrucciones</title>

      <!-- Ti etiqueta script ket mangpasingked iti rugi ti programa -->
      <script>

         // Anidar comillas: Mausar ti comilla sencilla (') iti uneg ti comilla doble (") para iti estilo
         document.write( "<h1 style = 'color: magenta'>" );

         // Concatenación (+): Ti operador + ket mangitipon iti dua nga string wenno linia ti teksto
         // Uso ti write: Magsusuno ti Isusulat dagiti teksto nga awan baro nga linia
         document.write( "Bienvenido a la programaci&oacute;n " +
            "en JavaScript</h1>" );

      </script>
      

   </head>
