<!DOCTYPE html>

<!-- Fig. 5.11: animacion.html -->
<!-- Animación en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Animación</title>
      <style type = "text/css">
         img
         {
            position: relative;
            /* Propiedad animation abreviada: name timing-function duration delay iteration-count direction */
            -webkit-animation: movingimage linear 10s 1s 2 alternate;
            -moz-animation: movingimage linear 10s 1s 2 alternate;
            animation: movingimage linear 10s 1s 2 alternate;
         }
         /* Regla @keyframes para WebKit: define los cambios de propiedades durante la animación */
         @-webkit-keyframes movingimage
         {
            0%   {opacity: 0; left: 50px; top: 0px;}   /* Inicio del ciclo (0s) */
            25%  {opacity: 1; left: 0px; top: 50px;}   /* 25% del tiempo (2.5s) */
            50%  {opacity: 0; left: 50px; top: 100px;} /* 50% del tiempo (5s) */
            75%  {opacity: 1; left: 100px; top: 50px;}  /* 75% del tiempo (7.5s) */
            100% {opacity: 0; left: 50px; top: 0px;}   /* Final del ciclo (10s) */
         }
         /* Regla @keyframes para Mozilla */
         @-moz-keyframes movingimage
         {
            0%   {opacity: 0; left: 50px; top: 0px;}
            25%  {opacity: 1; left: 0px; top: 50px;}
            50%  {opacity: 0; left: 50px; top: 100px;}
            75%  {opacity: 1; left: 100px; top: 50px;}
            100% {opacity: 0; left: 50px; top: 0px;}
         }
         /* Regla @keyframes estándar */
         @keyframes movingimage
         {
            0%   {opacity: 0; left: 50px; top: 0px;}
            25%  {opacity: 1; left: 0px; top: 50px;}
            50%  {opacity: 0; left: 50px; top: 100px;}
            75%  {opacity: 1; left: 100px; top: 50px;}
            100% {opacity: 0; left: 50px; top: 0px;}
         }
      </style>
   </head>
   <body>
      <img src = "image/jhtp.jpg" width = "138" height = "180"
         alt = "Portada del libro Java How to Program">
      <div></div>

      <a href="Indice todo.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
