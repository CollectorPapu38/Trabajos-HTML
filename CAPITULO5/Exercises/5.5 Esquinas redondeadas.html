<!DOCTYPE html>

<!-- Fig. 5.3: esquinasredondeadas.html -->
<!-- Uso de border-radius para aplicar distintos grados de redondeo a tres elementos. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Esquinas redondeadas</title>
      <style type = "text/css">
         .caja
         {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            text-align: center;
            margin-bottom: 20px;
            /* Flexbox para centrar vertical y horizontalmente el texto */
            display: flex;
            align-items: center;
            justify-content: center;
         }

         #caja1
         {
            background-color: rgb(225, 22, 73);
            border-radius: 10px; /* esquinas ligeramente redondeadas */
         }

         #caja2
         {
            background-color: rgb(162, 162, 33);
            border-radius: 50px; /* aumenta border-radius a 50px */
         }

         #caja3
         {
            background-color: rgb(2, 75, 53);
            border-radius: 100px; /* aumenta border-radius a 100px (circulo completo) */
         }
      </style>
   </head>
   <body>
      <div id = "caja1" class = "caja">
         <strong>border-radius: 10px</strong>
      </div>

      <div id = "caja2" class = "caja">
         <strong>border-radius: 50px</strong>
      </div>

      <div id = "caja3" class = "caja">
         <strong>border-radius: 100px</strong>
      </div>

    
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
