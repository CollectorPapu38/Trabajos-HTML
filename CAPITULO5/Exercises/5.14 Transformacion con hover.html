<!DOCTYPE html>

<!-- Ejercicio 5.14: Transformación con :hover -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Transformaci&oacute;n con :hover</title>
      <style type = "text/css">
         .galeria
         {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 50px;
            flex-wrap: wrap;
            gap: 20px;
         }
         .galeria img
         {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
            -webkit-transition: transform 0.3s ease;
            transition: transform 0.3s ease;
         }
         /* Aumenta el tamaño de la imagen un 20% al pasar el ratón */
         .galeria img:hover
         {
            -webkit-transform: scale(1.2);
            -ms-transform: scale(1.2);
            transform: scale(1.2);
         }
      </style>
   </head>
   <body>
      <h2>Puchele</h2>
      
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>

      <div class = "galeria">
         <img src = "image/jhtp.jpg" alt = "Imagen 1">
         <img src = "image/camello.jpg" alt = "Imagen 2">
         <img class = "img3" src = "image/cpphtp.png" alt = "Imagen 3">
         <img src = "image/daft.jpg" alt = "Imagen 4">
      </div>
   </body>
</html>
