<!DOCTYPE html>

<!-- Fig. 5.7: trazotexto.html -->
<!-- Trazo de texto en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Trazo de texto</title>
      <style type = "text/css">
         h1
         {
            color: LightBlue;
            -webkit-text-stroke: 3px Navy; /* prefijo de proveedor */
            -webkit-text-stroke: 3px Navy;
            font-size: 700%; /* aumenta el tamaño de la fuente */
         }
      </style>
   </head>
   <body>
      <h1>Nuevas funciones de WebKit</h1>

      
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
