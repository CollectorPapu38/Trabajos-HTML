<!DOCTYPE html>

<!-- Fig. 5.9: reflejo.html -->
<!-- Reflejos en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Reflejo a la derecha (20px)</title>
      <style type = "text/css">
         img { 
            margin-right: 180px; 
            margin-bottom: 30px;
         }
         img.right
         {
            /* Reflejo a la derecha con un espacio de 20px */
            -webkit-box-reflect: right 20px
               -webkit-gradient(
                  linear, right top, left top,
                  from(transparent), to(white));
         }
      </style>
   </head>
   <body>
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150" style="margin-right: 0;">
      </a>
      <br><br>

      <img class = "right" src = "image/jhtp.jpg" width = "138" height = "180"
         alt = "Portada del libro Java How to Program">
   </body>
</html>
