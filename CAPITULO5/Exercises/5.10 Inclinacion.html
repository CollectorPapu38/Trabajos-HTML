<!DOCTYPE html>

<!-- Fig. 5.13: inclinar.html -->
<!-- Elementos de inclinación y de transformación en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Inclinar (skew)</title>
      <style type = "text/css">
         .skew .textbox
         {
            margin-left: 75px;
            background: lightgreen;
            height: 100px;
            width: 200px;
            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid DarkGreen;
            border-radius: 15px;
            -webkit-animation: skew 3s infinite linear;
            -moz-animation: skew 3s infinite linear;
            animation: skew 3s infinite linear;
         }
         @-webkit-keyframes skew
         {
            0%   { -webkit-transform: skew(0deg, 0deg); }
            25%  { -webkit-transform: skewY(30deg); }
            50%  { -webkit-transform: skew(0deg, 0deg); }
            75%  { -webkit-transform: skewX(30deg); }
            100% { -webkit-transform: skew(0deg, 0deg); }
         }
         @-moz-keyframes skew
         {
            0%   { -moz-transform: skew(0deg, 0deg); }
            25%  { -moz-transform: skewY(30deg); }
            50%  { -moz-transform: skew(0deg, 0deg); }
            75%  { -moz-transform: skewX(30deg); }
            100% { -moz-transform: skew(0deg, 0deg); }
         }
         @keyframes skew
         {
            0%   { transform: skew(0deg, 0deg); }
            25%  { transform: skewY(30deg); }
            50%  { transform: skew(0deg, 0deg); }
            75%  { transform: skewX(30deg); }
            100% { transform: skew(0deg, 0deg); }
         }
      </style>
   </head>
   <body>
      <div class = "box skew">
         <div class = "textbox">Inclinar texto</div>
      </div>

      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
