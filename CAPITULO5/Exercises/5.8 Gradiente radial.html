<!DOCTYPE html>

<!-- Fig. 5.6: gradienteradial.html -->
<!-- Gradientes radiales en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Gradiente radial</title>
      <style type = "text/css">
         div
         {
            width: 500px;
            height: 500px;
            padding: 5px;
            text-align: center;
            
            background: -webkit-radial-gradient(bottom left, circle, yellow, orange, red);
            
            background: -moz-radial-gradient(bottom left, circle, yellow, orange, red);
           
            background: radial-gradient(circle at bottom left, yellow, orange, red);
            margin-bottom: 20px;
         }
      </style>
   </head>
   <body>
      <div><h2>Gradiente radial desde esquina inferior izquierda</h2></div>

      
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
