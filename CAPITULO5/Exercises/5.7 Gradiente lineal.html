<!DOCTYPE html>

<!-- Fig. 5.4: gradientelineal.html -->
<!-- Gradientes lineales en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Gradiente lineal</title>
      <style type = "text/css">
         div
         {
            width: 500px;
            height: 500px;
            border: 3px solid black;
            padding: 5px 20px;
            text-align: center;
            /* Gradiente lineal diagonal de WebKit */
            background: -webkit-gradient(
               linear, left top, right bottom,
               from(red),
               color-stop(16%, orange),
               color-stop(33%, yellow),
               color-stop(50%, green),
               color-stop(66%, blue),
               color-stop(83%, indigo),
               to(violet)
            );
            /* Gradiente lineal diagonal de Mozilla */
            background: -moz-linear-gradient(
               top left, red, orange, yellow, green, blue, indigo, violet
            );
            /* Gradiente lineal diagonal estándar */
            background: linear-gradient(
               135deg, red, orange, yellow, green, blue, indigo, violet
            );
            margin-bottom: 20px;
         }
      </style>
   </head>
   <body>
      <div><h2>Gradiente lineal arcoíris</h2></div>

    
      <a href="Ir a indice.html">
         <img src="image/rever.png" alt="Ir al Menú" width="150">
      </a>
   </body>
</html>
