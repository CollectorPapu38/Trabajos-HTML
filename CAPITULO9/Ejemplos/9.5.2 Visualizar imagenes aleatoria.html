<!DOCTYPE html>

<!-- Fig. 9.5: TirarDados.html -->
<!-- Generación de imágenes aleatorias de dados usando Math.random. -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Im&aacute;genes aleatorias de dados</title>
      <style type="text/css">
         li { display: inline; margin-right: 10px; }
         ol { margin: 0; }
      </style>
      <script>

         var imagenDado1;
         var imagenDado2;
         var imagenDado3;
         var imagenDado4;

         function iniciar()
         {
            var boton = document.getElementById( "botonTirar" );
            boton.addEventListener( "click", tirarDados, false );
            imagenDado1 = document.getElementById( "dado1" );
            imagenDado2 = document.getElementById( "dado2" );
            imagenDado3 = document.getElementById( "dado3" );
            imagenDado4 = document.getElementById( "dado4" );
         }

         function tirarDados()
         {
            establecerImagen( imagenDado1 );
            establecerImagen( imagenDado2 );
            establecerImagen( imagenDado3 );
            establecerImagen( imagenDado4 );
         }

         function establecerImagen( imgDado )
         {
            var valorDado = Math.floor( 1 + Math.random() * 6 );
            // Apunta correctamente a la carpeta "image/"
            imgDado.setAttribute( "src", "image/dado" + valorDado + ".png" );
            imgDado.setAttribute( "alt",
               "imagen de un dado con " + valorDado + " punto(s)" );
         }

         window.addEventListener( "load", iniciar, false );

      </script>
   </head>
   <body>
      <form action="#">
         <input id="botonTirar" type="button" value="Tirar dados">
      </form>
      <ol>
         <li><img id="dado1" src="image/blanco.png" alt="imagen en blanco"></li>
         <li><img id="dado2" src="image/blanco.png" alt="imagen en blanco"></li>
         <li><img id="dado3" src="image/blanco.png" alt="imagen en blanco"></li>
         <li><img id="dado4" src="image/blanco.png" alt="imagen en blanco"></li>
      </ol>
      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
