         document.write( "<p><strong>a) ¿Qué significa elegir números 'al azar'?</strong><br>" +
                         "Significa que cada número dentro de un rango específico tiene exactamente la misma probabilidad de ser seleccionado.</p>" );

         document.write( "<p><strong>b) ¿Por qué es útil la función Math.random para simular juegos de probabilidad?</strong><br>" +

         document.write( "<p><strong>c) ¿Por qué es a menudo necesario escalar y/o desplazar los valores producidos por Math.random?</strong><br>" +
                         "Porque Math.random() solo entrega valores fraccionarios menores a 1, y el escalado/desplazamiento permite obtener los rangos enteros deseados.</p>" );

         document.write( "<p><strong>d) ¿Por qué es la simulación computarizada de situaciones reales una técnica útil?</strong><br>" +
                         "Porque permite analizar comportamientos y evaluar probabilidades de forma rápida y sin los costos o riesgos del mundo real.</p>" );
