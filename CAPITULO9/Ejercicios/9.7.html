<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.7</title>
      <script>
         function calcularArea()
         {
            var radio = parseFloat( document.getElementById( "radioInput" ).value );
            var area = areaCirculo( radio );
            document.getElementById( "resultado" ).innerHTML = "El área es: " + area.toFixed( 2 );
         }

         function areaCirculo( r )
         {
            return Math.PI * r * r;
         }

         function iniciar()
         {
            document.getElementById( "boton" ).addEventListener( "click", calcularArea, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h3>Área del Círculo</h3>
      <form action="#">
         Radio: <input id="radioInput" type="text">
         <input id="boton" type="button" value="Calcular">
      </form>
      <p id="resultado"></p>

      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
