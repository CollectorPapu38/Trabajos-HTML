<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.15</title>
      <script>
         function esPar( n )
         {
            return ( n % 2 === 0 );
         }

         function probarPares()
         {
            var entrada = prompt( "Introduce un entero para saber si es par o impar (o escribe 'salir' para terminar):" );
            var salida = "";

            while ( entrada !== null && entrada.toLowerCase() !== "salir" )
            {
               var numero = parseInt( entrada );
               if ( !isNaN( numero ) )
               {
                  var resultado = esPar( numero );
                  salida += "<p>El número " + numero + " ¿es par?: <strong>" + resultado + "</strong></p>";
               }
               entrada = prompt( "Introduce otro entero (o escribe 'salir' para terminar):" );
            }

            document.getElementById( "resultados" ).innerHTML = salida;
         }

         window.addEventListener( "load", probarPares, false );
      </script>
   </head>
   <body>
      <h3>9.15 Función esPar con Prompt</h3>
      <div id="resultados"></div>

      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
