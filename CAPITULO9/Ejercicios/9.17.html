<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.17 </title>
      <script>
         function celsius( f )
         {
            return 5.0 / 9.0 * ( f - 32 );
         }

         function fahrenheit( c )
         {
            return 9.0 / 5.0 * c + 32;
         }

         function convertirFtoC()
         {
            var f = parseFloat( document.getElementById( "tempInput" ).value );
            var c = celsius( f );
            document.getElementById( "resultado" ).innerHTML = f + " °F equivalen a <strong>" + c.toFixed( 2 ) + " °C</strong>";
         }

         function convertirCtoF()
         {
            var c = parseFloat( document.getElementById( "tempInput" ).value );
            var f = fahrenheit( c );
            document.getElementById( "resultado" ).innerHTML = c + " °C equivalen a <strong>" + f.toFixed( 2 ) + " °F</strong>";
         }

         function iniciar()
         {
            document.getElementById( "btnFC" ).addEventListener( "click", convertirFtoC, false );
            document.getElementById( "btnCF" ).addEventListener( "click", convertirCtoF, false );
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h3>9.17 Conversión de Temperaturas</h3>
      <form action="#">
         Temperatura: <input id="tempInput" type="text"><br><br>
         <input id="btnFC" type="button" value="Fahrenheit a Celsius">
         <input id="btnCF" type="button" value="Celsius a Fahrenheit">
      </form>
      <p id="resultado"></p>

      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
