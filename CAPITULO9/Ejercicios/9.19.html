<!DOCTYPE html>
<html>
   <head>
   <meta charset="utf-8">
   <title>Ejercicio 9.19</title>
   <script>
      function esPrimo( n )
      {
         if ( n <= 1 ) return false;
         var limite = Math.sqrt( n );
         for ( var i = 2; i <= limite; i++ )
         {
            if ( n % i === 0 ) return false;
         }
         return true;
      }

      function ejecutarPrimos()
      {
         var primos = [];
         for ( var i = 1; i <= 10000; i++ )
         {
            if ( esPrimo( i ) ) primos.push( i );
         }

         var texto = "--- Ejercicio 9.19 ---\n\n";
         texto += "b) Primos entre 1 y 10,000:\n" + primos.join( ", " ) + "\n\n";
         texto += "¿Cuántos números se tienen que probar en realidad?\n";
         texto += "En la práctica, para cada número 'n', solo necesitamos probar los divisores hasta su raíz cuadrada (Math.sqrt(n)), ";
         texto += "lo que reduce drásticamente las comprobaciones necesarias frente a probar hasta n/2 o n-1.\n\n";
         texto += "c) ¿Por qué la raíz cuadrada?\n";
         texto += "Si un número n tiene un divisor mayor que su raíz cuadrada, necesariamente debe tener un factor correspondiente menor que su raíz cuadrada. ";
         texto += "Por lo tanto, si no encontramos un divisor menor o igual a la raíz cuadrada, el número es garantizadamente primo, mejorando notablemente el rendimiento.";

         document.getElementById( "resultadosArea" ).value = texto;
      }

      window.addEventListener( "load", ejecutarPrimos, false );
   </script>
   </head>
   <body>
      <h3>Ejercicio 9.19 - Números Primos</h3>
      <textarea id="resultadosArea" rows="12" cols="80" readonly></textarea>

      <br><br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
