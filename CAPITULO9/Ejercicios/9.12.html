   <body>
      <script>
         document.write( "<h3>9.12 Instrucción para imprimir un número al azar de un conjunto</h3>" );

         document.write( "<p><strong>a) 2, 4, 6, 8, 10:</strong><br>" +
                         "<code>document.write( 2 * Math.floor( 1 + Math.random() * 5 ) );</code></p>" );

         document.write( "<p><strong>b) 3, 5, 7, 9, 11:</strong><br>" +
                         "<code>document.write( 2 * Math.floor( 1 + Math.random() * 5 ) + 1 );</code></p>" );

         document.write( "<p><strong>c) 6, 10, 14, 18, 22:</strong><br>" +
                         "<code>document.write( 4 * Math.floor( 1 + Math.random() * 5 ) + 2 );</code></p>" );
      </script>
