      <script>
         document.write( "<h3>9.11 Instrucciones para rangos aleatorios de la variable n</h3>" );

         document.write( "<p><strong>a) 1 &le; n &le; 2:</strong><br>" +
                         "<code>n = Math.floor( 1 + Math.random() * 2 );</code></p>" );

         document.write( "<p><strong>b) 1 &le; n &le; 100:</strong><br>" +
                         "<code>n = Math.floor( 1 + Math.random() * 100 );</code></p>" );

         document.write( "<p><strong>c) 0 &le; n &le; 9:</strong><br>" +
                         "<code>n = Math.floor( Math.random() * 10 );</code></p>" );

         document.write( "<p><strong>d) 1000 &le; n &le; 1112:</strong><br>" +
                         "<code>n = Math.floor( 1000 + Math.random() * 113 );</code></p>" );

         document.write( "<p><strong>e) -1 &le; n &le; 1:</strong><br>" +
                         "<code>n = Math.floor( -1 + Math.random() * 3 );</code></p>" );

         document.write( "<p><strong>f) -3 &le; n &le; 11:</strong><br>" +
                         "<code>n = Math.floor( -3 + Math.random() * 15 );</code></p>" );
      </script>
