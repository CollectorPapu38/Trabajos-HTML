<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.23</title>
      <script>
         var num1, num2, respuestaCorrecta;

         function generarPregunta()
         {
            num1 = Math.floor( Math.random() * 9 ) + 1;
            num2 = Math.floor( Math.random() * 9 ) + 1;
            respuestaCorrecta = num1 * num2;
            document.getElementById( "pregunta" ).innerHTML = "¿Cuánto es " + num1 + " por " + num2 + "?";
            document.getElementById( "respuesta" ).value = "";
            document.getElementById( "mensaje" ).innerHTML = "";
         }

         function obtenerRespuestaCorrectaAleatoria()
         {
            var aleatorio = Math.floor( Math.random() * 4 ) + 1;
            switch( aleatorio )
            {
               case 1: return "¡Muy bien!";
               case 2: return "Excelente.";
               case 3: return "Buen trabajo.";
               case 4: return "Siga así.";
            }
         }

         function obtenerRespuestaIncorrectaAleatoria()
         {
            var aleatorio = Math.floor( Math.random() * 4 ) + 1;
            switch( aleatorio )
            {
               case 1: return "No. Intente de nuevo.";
               case 2: return "Equivocado. Trate una vez más.";
               case 3: return "No se dé por vencido.";
               case 4: return "No. Siga intentando.";
            }
         }

         function verificarRespuesta()
         {
            var respuestaUsuario = parseInt( document.getElementById( "respuesta" ).value );
            var mensajeP = document.getElementById( "mensaje" );

            if ( respuestaUsuario === respuestaCorrecta )
            {
               mensajeP.innerHTML = "<strong>" + obtenerRespuestaCorrectaAleatoria() + "</strong>";
               setTimeout( generarPregunta, 1500 );
            }
            else
            {
               mensajeP.innerHTML = "<strong>" + obtenerRespuestaIncorrectaAleatoria() + "</strong>";
               document.getElementById( "respuesta" ).value = "";
            }
         }

         function iniciar()
         {
            document.getElementById( "btnEnviar" ).addEventListener( "click", verificarRespuesta, false );
            generarPregunta();
         }

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <h3>CAI - Variedad de Respuestas</h3>
      <p id="pregunta"></p>
      <form action="#">
         <input id="respuesta" type="text">
         <input id="btnEnviar" type="button" value="Enviar Respuesta">
      </form>
      <p id="mensaje"></p>

      <br>
      <a href="Indi.html">
         <img src="image/rever.png" alt="Ir al Índice" width="60" style="vertical-align: middle;">
      </a>
   </body>
</html>
